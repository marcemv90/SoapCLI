# SoapCLI web UI with workspaces: one folder per team or project, each with its own profiles, placeholder options,
# attachments, saved requests and secrets.
#
#   docker compose up -d       then open http://localhost:8080
#   docker compose down        to stop it
#
# What is in this folder (every path below is relative to it):
#   soapcli.env   the container's environment: the login and where it may call
#   workspaces/   becomes /workspaces: each folder in it is a workspace (billing, shipping...); the UI can edit them
#   mock/         a tiny SOAP service to try everything without a real one (the `mock` service below)
name: soapcli-workspaces-example

services:
  soapcli:
    image: ghcr.io/marcemv90/soapcli:latest     # or pin a release, e.g. :2.3.0
    ports:
      - "127.0.0.1:8080:8080"                   # this machine only; "8080:8080" publishes it on the network (set a login first!)
    env_file:
      - soapcli.env
    environment:
      SOAPCLI_WORKSPACES_DIR: /workspaces
      # Lets the UI edit profiles and placeholder options, and create and remove workspaces. Inside a container the server
      # listens on a network address, so those are off unless they are asked for. (Saving requests into a workspace does
      # not need it.) Delete this line if the UI should only read them.
      SOAPCLI_ALLOW_CONFIG_EDIT: "true"
    # For the UI to write to ./workspaces, the container must run as a user that can: yours (`id -u` and `id -g`).
    user: "1000:1000"
    volumes:
      - ./workspaces:/workspaces
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # A service to send requests to while you try it out: http://mock:8081/soap (the `demo` and `tracking` profiles use it).
  # Delete this service when you point SoapCLI at your own endpoints.
  mock:
    image: python:3-alpine
    command: ["python", "-u", "/mock/server.py"]
    volumes:
      - ./mock/server.py:/mock/server.py:ro
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
