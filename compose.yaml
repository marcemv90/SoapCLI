# docker compose up -d      then open http://localhost:8080
#
# The web UI of SoapCLI. By default only this machine can reach it. Before publishing the port on a network,
# set a login (SOAPCLI_UI_USER / SOAPCLI_UI_PASSWORD) and, if you can, the destinations it may call.
services:
  soapcli:
    image: ghcr.io/marcemv90/soapcli:latest
    # build: .                       # build from this checkout instead of pulling the image
    ports:
      - "127.0.0.1:8080:8080"        # use "8080:8080" to publish on the network (set a login first!)
    environment:
      # Put these in a .env file next to this one; an empty value means "not set".
      SOAPCLI_UI_USER: ${SOAPCLI_UI_USER:-}
      SOAPCLI_UI_PASSWORD: ${SOAPCLI_UI_PASSWORD:-}
      # Only these destinations may be called, comma separated, e.g. "*.corp.example.com,10.1.*". Empty = any.
      SOAPCLI_ALLOWED_HOSTS: ${SOAPCLI_ALLOWED_HOSTS:-}
      # Let the UI edit the profiles and placeholders files in ./config (needs the volume below without :ro, and a login):
      # SOAPCLI_ALLOW_CONFIG_EDIT: "true"
      # Secrets referenced from profiles as ${ACC_CREDENTIALS}:
      # ACC_CREDENTIALS: ${ACC_CREDENTIALS:-}
    volumes:
      - ./config:/config:ro          # profiles.json and placeholders.json (optional); drop :ro to let the UI edit them
      # - ./attachments:/work:ro     # files the UI may attach by path (it can read nothing else); optional
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
