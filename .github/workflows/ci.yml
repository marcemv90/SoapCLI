name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ["11", "17", "21"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # `verify` compiles with --release 11, runs the whole test suite and builds the fat JAR.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Smoke test the packaged JAR
        run: java -jar target/SoapCLI.jar --version

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install MkDocs and theme
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      # --strict fails on broken links and pages missing from the navigation.
      - name: Build site
        run: mkdocs build --strict --clean

  ui:
    name: Web UI (typecheck, tests, build is up to date)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      # --ignore-scripts: nothing in the dependency tree needs to run code at install time.
      - name: Install dependencies
        working-directory: web-ui
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: web-ui
        run: npm run typecheck

      - name: Unit tests
        working-directory: web-ui
        run: npm test

      # The compiled UI is committed (so building the jar needs no Node). This makes sure it matches the sources.
      - name: Build, and check that the committed build is current
        run: |
          npm --prefix web-ui run build
          if [ -n "$(git status --porcelain -- src/main/resources/web)" ]; then
            git status --porcelain -- src/main/resources/web
            echo "::error::src/main/resources/web is out of date. Run 'npm run build' in web-ui and commit the result."
            exit 1
          fi

  docker:
    name: Docker image (build, UI mode, command line mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg VERSION=0.0.0-ci -t soapcli:ci .

      - name: Command line mode
        run: |
          docker run --rm soapcli:ci --version | tee version.txt
          grep -qx "SoapCLI 0.0.0-ci" version.txt
          docker run --rm soapcli:ci cli --version | grep -qx "SoapCLI 0.0.0-ci"
          printf '<a/>' | docker run --rm -i soapcli:ci --endpoint http://example.invalid/soap --dry-run | grep -q "SOAP-CLI DRY-RUN"
          # stdin, a file from a mounted directory, and the exit code of a call that cannot be delivered
          printf '<a/>' > request.xml
          set +e
          docker run --rm -v "$PWD:/work" soapcli:ci --endpoint http://127.0.0.1:1/ --request-file request.xml
          test "$?" -eq 2

      - name: Web UI mode (the default)
        run: |
          docker run -d --name ui -p 18080:8080 soapcli:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:18080/api/info | grep -q '"version":"0.0.0-ci"'
          docker exec ui java -jar /app/SoapCLI.jar healthcheck
          docker logs ui

      - name: Web UI with a login
        run: |
          docker rm -f ui
          docker run -d --name ui -p 18080:8080 -e SOAPCLI_UI_USER=alice -e SOAPCLI_UI_PASSWORD=secret soapcli:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = "401"
          curl -fsS -u alice:secret -o /dev/null http://127.0.0.1:18080/
          docker rm -f ui

      - name: Does not run as root
        run: test "$(docker run --rm --entrypoint id soapcli:ci -u)" != "0"

  # The published image also has a linux/arm64 variant (Apple Silicon, ARM servers). This builds it and runs it under
  # emulation, so a broken arm64 image is found here and not by a user. Emulation is slow: only the essentials run.
  docker-arm64:
    name: Docker image (linux/arm64, emulated)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          provenance: false
          build-args: |
            VERSION=0.0.0-ci
          tags: soapcli:arm64

      - name: It is arm64 and the command line mode works
        run: |
          test "$(docker run --rm --platform linux/arm64 --entrypoint uname soapcli:arm64 -m)" = "aarch64"
          docker run --rm --platform linux/arm64 soapcli:arm64 --version | grep -qx "SoapCLI 0.0.0-ci"
          printf '<a/>' | docker run --rm -i --platform linux/arm64 soapcli:arm64 --endpoint http://example.invalid/soap --dry-run | grep -q "SOAP-CLI DRY-RUN"

      - name: The web UI starts
        run: |
          docker run -d --name ui --platform linux/arm64 -p 18080:8080 soapcli:arm64
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:18080/api/info | grep -q '"version":"0.0.0-ci"'
          docker logs ui

  # examples/docker is what people copy and edit, so it has to keep working: this starts it with the image built from this
  # checkout (in place of the published one the compose file names) and uses it the way its README describes.
  docker-example:
    name: Docker example (examples/docker)
    runs-on: ubuntu-latest
    # bash with pipefail, so that a failing command in the middle of a pipeline fails the step.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the image the example uses
        run: docker build --build-arg VERSION=0.0.0-ci -t ghcr.io/marcemv90/soapcli:latest .

      - name: The compose file is valid
        run: docker compose -f examples/docker/docker-compose.yml config --quiet

      # The container runs as uid 1000, and the checkout belongs to the runner's user: let it write to the files the UI edits.
      - name: Start the example
        run: |
          chmod -R a+rwX examples/docker/config
          docker compose -f examples/docker/docker-compose.yml up -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Its profiles and placeholder options are all valid, and the UI may edit them
        run: |
          base=http://127.0.0.1:8080
          curl -fsS $base/api/profiles | jq -e '(.profiles | map(.name)) == ["base","demo","demo-upload","acceptance","production-mtls"] and all(.profiles[]; .error == null) and .editable'
          curl -fsS $base/api/placeholders | jq -e '(.placeholders | map(.name)) == ["ENV","ORDER_ID","COUNTRY"] and all(.placeholders[]; .error == null) and .editable'

      - name: The demo profiles work against the mock service
        run: |
          base=http://127.0.0.1:8080
          send() { curl -fsS -X POST -H 'Content-Type: application/json' -d "{\"profile\":\"$1\"}" $base/api/send; }
          # the request file comes from ./work, the variables take their defaults, the header comes from the profile it extends
          send demo | jq -e '.status == 200 and (.body | contains("EchoResponse") and contains("urn:GetOrder") and contains("1001") and contains("soapcli-example"))'
          # the file named by the profile is read on the server and inlined as Base64
          send demo-upload | jq -e '.status == 200 and (.body | contains("[base64:") and contains("UploadInvoice"))'

      - name: The UI can edit a profile, and the comments of the file survive
        run: |
          base=http://127.0.0.1:8080
          file=examples/docker/config/profiles.json
          revision=$(curl -fsS $base/api/profiles | jq -r .revision)
          curl -fsS $base/api/profiles/demo/definition \
            | jq --arg revision "$revision" '{name: "demo", revision: $revision, create: false, definition: (.definition | .timeout = 30)}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- $base/api/profiles/save | jq -e '.revision != null'
          grep -q '"timeout": 30' "$file"
          grep -q 'Edit this file by hand, or from the web UI' "$file"
          grep -q 'What the others share' "$file"
          curl -fsS $base/api/profiles | jq -e 'all(.profiles[]; .error == null)'

      - name: Logs
        if: always()
        run: docker compose -f examples/docker/docker-compose.yml logs --no-color

      - name: Stop the example
        if: always()
        run: docker compose -f examples/docker/docker-compose.yml down -v
