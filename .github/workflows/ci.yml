name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ["11", "17", "21"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # `verify` compiles with --release 11, runs the whole test suite and builds the fat JAR.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Smoke test the packaged JAR
        run: java -jar target/SoapCLI.jar --version

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install MkDocs and theme
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      # --strict fails on broken links and pages missing from the navigation.
      - name: Build site
        run: mkdocs build --strict --clean

  ui:
    name: Web UI (typecheck, tests, build is up to date)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      # --ignore-scripts: nothing in the dependency tree needs to run code at install time.
      - name: Install dependencies
        working-directory: web-ui
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: web-ui
        run: npm run typecheck

      - name: Unit tests
        working-directory: web-ui
        run: npm test

      # The compiled UI is committed (so building the jar needs no Node). This makes sure it matches the sources.
      - name: Build, and check that the committed build is current
        run: |
          npm --prefix web-ui run build
          if [ -n "$(git status --porcelain -- src/main/resources/web)" ]; then
            git status --porcelain -- src/main/resources/web
            echo "::error::src/main/resources/web is out of date. Run 'npm run build' in web-ui and commit the result."
            exit 1
          fi

  docker:
    name: Docker image (build, UI mode, command line mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg VERSION=0.0.0-ci -t soapcli:ci .

      - name: Command line mode
        run: |
          docker run --rm soapcli:ci --version | tee version.txt
          grep -qx "SoapCLI 0.0.0-ci" version.txt
          docker run --rm soapcli:ci cli --version | grep -qx "SoapCLI 0.0.0-ci"
          printf '<a/>' | docker run --rm -i soapcli:ci --endpoint http://example.invalid/soap --dry-run | grep -q "SOAP-CLI DRY-RUN"
          # stdin, a file from a mounted directory, and the exit code of a call that cannot be delivered
          printf '<a/>' > request.xml
          set +e
          docker run --rm -v "$PWD:/work" soapcli:ci --endpoint http://127.0.0.1:1/ --request-file request.xml
          test "$?" -eq 2

      - name: Web UI mode (the default)
        run: |
          docker run -d --name ui -p 18080:8080 soapcli:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:18080/api/info | grep -q '"version":"0.0.0-ci"'
          docker exec ui java -jar /app/SoapCLI.jar healthcheck
          docker logs ui

      - name: Web UI with a login
        run: |
          docker rm -f ui
          docker run -d --name ui -p 18080:8080 -e SOAPCLI_UI_USER=alice -e SOAPCLI_UI_PASSWORD=secret soapcli:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = "401"
          curl -fsS -u alice:secret -o /dev/null http://127.0.0.1:18080/
          docker rm -f ui

      # Workspaces: the image has an empty /workspaces for the unprivileged user; the UI creates a workspace in a mounted folder,
      # a profile is saved into it, and the command line client of the same image reads that workspace.
      - name: Web UI with workspaces, and the command line client in the same workspace
        run: |
          mkdir ws && chmod a+rwx ws
          docker run -d --name ui -p 18080:8080 -e SOAPCLI_WORKSPACES_DIR=/workspaces -e SOAPCLI_ALLOW_CONFIG_EDIT=true \
            -v "$PWD/ws:/workspaces" soapcli:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          json() { curl -fsS -X POST -H 'Content-Type: application/json' "$@"; }
          curl -fsS http://127.0.0.1:18080/api/workspaces | jq -e '.enabled and .manageable and (.workspaces | length) == 0'
          json -d '{"name":"team","description":"made by the CI"}' http://127.0.0.1:18080/api/workspaces/create | jq -e '.name == "team"'
          test -d ws/team/attachments && test -d ws/team/requests && test -f ws/team/workspace.json
          json -d '{"name":"p","revision":"missing","create":true,"definition":{"endpoint":"http://example.invalid/soap"}}' \
            http://127.0.0.1:18080/api/workspaces/team/profiles/save | jq -e '.revision != null'
          json -d '{"name":"Saved","draft":{"body":"<a/>"}}' http://127.0.0.1:18080/api/workspaces/team/requests/save | jq -e '.id != null'
          test "$(ls ws/team/requests | wc -l)" = "1"
          docker run --rm -e SOAPCLI_WORKSPACES_DIR=/workspaces -v "$PWD/ws:/workspaces:ro" soapcli:ci --workspace team --list-profiles | grep -q -- "- p"
          printf '<a/>' | docker run --rm -i -e SOAPCLI_WORKSPACES_DIR=/workspaces -v "$PWD/ws:/workspaces:ro" soapcli:ci \
            --workspace team --profile p --dry-run | grep -q "SOAP-CLI DRY-RUN"
          docker logs ui
          docker rm -f ui

      - name: Does not run as root
        run: test "$(docker run --rm --entrypoint id soapcli:ci -u)" != "0"

  # The published image also has a linux/arm64 variant (Apple Silicon, ARM servers). This builds it and runs it under
  # emulation, so a broken arm64 image is found here and not by a user. Emulation is slow: only the essentials run.
  docker-arm64:
    name: Docker image (linux/arm64, emulated)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          provenance: false
          build-args: |
            VERSION=0.0.0-ci
          tags: soapcli:arm64

      - name: It is arm64 and the command line mode works
        run: |
          test "$(docker run --rm --platform linux/arm64 --entrypoint uname soapcli:arm64 -m)" = "aarch64"
          docker run --rm --platform linux/arm64 soapcli:arm64 --version | grep -qx "SoapCLI 0.0.0-ci"
          printf '<a/>' | docker run --rm -i --platform linux/arm64 soapcli:arm64 --endpoint http://example.invalid/soap --dry-run | grep -q "SOAP-CLI DRY-RUN"

      - name: The web UI starts
        run: |
          docker run -d --name ui --platform linux/arm64 -p 18080:8080 soapcli:arm64
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:18080/api/info | grep -q '"version":"0.0.0-ci"'
          docker logs ui

  # examples/docker is what people copy and edit, so it has to keep working: this starts it with the image built from this
  # checkout (in place of the published one the compose file names) and uses it the way its README describes.
  docker-example:
    name: Docker example (examples/docker)
    runs-on: ubuntu-latest
    # bash with pipefail, so that a failing command in the middle of a pipeline fails the step.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the image the example uses
        run: docker build --build-arg VERSION=0.0.0-ci -t ghcr.io/marcemv90/soapcli:latest .

      - name: The compose file is valid
        run: docker compose -f examples/docker/docker-compose.yml config --quiet

      # The container runs as uid 1000, and the checkout belongs to the runner's user: let it write to the files the UI edits.
      - name: Start the example
        run: |
          chmod -R a+rwX examples/docker/config
          docker compose -f examples/docker/docker-compose.yml up -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Its profiles and placeholder options are all valid, and the UI may edit them
        run: |
          base=http://127.0.0.1:8080
          curl -fsS $base/api/profiles | jq -e '(.profiles | map(.name)) == ["base","demo","demo-upload","acceptance","production-mtls"] and all(.profiles[]; .error == null) and .editable'
          curl -fsS $base/api/placeholders | jq -e '(.placeholders | map(.name)) == ["ENV","ORDER_ID","COUNTRY"] and all(.placeholders[]; .error == null) and .editable'

      - name: The demo profiles work against the mock service
        run: |
          base=http://127.0.0.1:8080
          send() { curl -fsS -X POST -H 'Content-Type: application/json' -d "{\"profile\":\"$1\"}" $base/api/send; }
          # the request file comes from ./work, the variables take their defaults, the header comes from the profile it extends
          send demo | jq -e '.status == 200 and (.body | contains("EchoResponse") and contains("urn:GetOrder") and contains("1001") and contains("soapcli-example"))'
          # the file named by the profile is read on the server and inlined as Base64
          send demo-upload | jq -e '.status == 200 and (.body | contains("[base64:") and contains("UploadInvoice"))'

      - name: The UI can edit a profile, and the comments of the file survive
        run: |
          base=http://127.0.0.1:8080
          file=examples/docker/config/profiles.json
          revision=$(curl -fsS $base/api/profiles | jq -r .revision)
          curl -fsS $base/api/profiles/demo/definition \
            | jq --arg revision "$revision" '{name: "demo", revision: $revision, create: false, definition: (.definition | .timeout = 30)}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- $base/api/profiles/save | jq -e '.revision != null'
          grep -q '"timeout": 30' "$file"
          grep -q 'Edit this file by hand, or from the web UI' "$file"
          grep -q 'What the others share' "$file"
          curl -fsS $base/api/profiles | jq -e 'all(.profiles[]; .error == null)'

      - name: Logs
        if: always()
        run: docker compose -f examples/docker/docker-compose.yml logs --no-color

      - name: Stop the example
        if: always()
        run: docker compose -f examples/docker/docker-compose.yml down -v

  # examples/workspaces is the same idea for workspaces: it starts the example with the image built from this checkout and uses it the
  # way its README describes.
  docker-workspaces-example:
    name: Docker example (examples/workspaces)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the image the example uses
        run: docker build --build-arg VERSION=0.0.0-ci -t ghcr.io/marcemv90/soapcli:latest .

      - name: The compose file is valid
        run: docker compose -f examples/workspaces/docker-compose.yml config --quiet

      # The container runs as uid 1000, and the checkout belongs to the runner's user: let it write to the workspaces.
      - name: Start the example
        run: |
          chmod -R a+rwX examples/workspaces/workspaces
          docker compose -f examples/workspaces/docker-compose.yml up -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Its workspaces, profiles, placeholder options and saved requests are all valid
        run: |
          base=http://127.0.0.1:8080
          curl -fsS $base/api/workspaces | jq -e '(.workspaces | map(.name)) == ["billing","shipping"] and .manageable and all(.workspaces[]; .error == null)'
          curl -fsS $base/api/workspaces/billing/profiles | jq -e '(.profiles | map(.name)) == ["base","demo","demo-upload","acceptance","production-mtls"] and all(.profiles[]; .error == null) and .editable'
          curl -fsS $base/api/workspaces/billing/placeholders | jq -e '(.placeholders | map(.name)) == ["ENV","ORDER_ID","COUNTRY"] and all(.placeholders[]; .error == null) and .editable'
          curl -fsS $base/api/workspaces/billing/requests | jq -e '(.requests | map(.name)) == ["Upload an invoice (demo)","Get order (demo)"] and all(.requests[]; .error == null) and .editable'
          curl -fsS $base/api/workspaces/shipping/profiles | jq -e '(.profiles | map(.name)) == ["tracking"] and (.editable | not)'

      - name: The profiles and the saved requests work against the mock service
        run: |
          base=http://127.0.0.1:8080
          json() { curl -fsS -X POST -H 'Content-Type: application/json' "$@"; }
          # the request file comes from the workspace's templates/ folder (a relative path starts in the workspace folder)
          json -d '{"profile":"demo"}' $base/api/workspaces/billing/send | jq -e '.status == 200 and (.body | contains("EchoResponse") and contains("urn:GetOrder") and contains("1001") and contains("soapcli-workspaces-example"))'
          json -d '{"profile":"demo-upload"}' $base/api/workspaces/billing/send | jq -e '.status == 200 and (.body | contains("[base64:") and contains("UploadInvoice"))'
          # a saved request, sent the way the page sends it: its body, and the attachment named by path, from the attachments/ of the workspace
          curl -fsS $base/api/workspaces/billing/requests/upload-invoice-demo \
            | jq '{profile: .draft.profile, body: .draft.body, attachments: .draft.attachments}' \
            | json -d @- $base/api/workspaces/billing/send | jq -e '.status == 200 and (.body | contains("[base64:"))'
          curl -fsS $base/api/workspaces/shipping/requests/track-parcel \
            | jq '{profile: .draft.profile, body: .draft.body, args: .draft.args}' \
            | json -d @- $base/api/workspaces/shipping/send | jq -e '.status == 200 and (.body | contains("shipping") and contains("NL1234567890"))'
          # the secrets of the workspace (secrets.env) feed its profiles: the profile resolves, and its credentials stay masked
          json -d '{"profile":"acceptance","body":"<a/>"}' $base/api/workspaces/billing/preview | jq -e '.headers | any(.name == "Authorization" and .value == "Basic ****")'

      - name: A request can be saved into a workspace, a read-only one refuses, and a workspace can be created
        run: |
          base=http://127.0.0.1:8080
          ws=examples/workspaces/workspaces
          json() { curl -fsS -X POST -H 'Content-Type: application/json' "$@"; }
          id=$(json -d '{"name":"From CI","folder":"CI","draft":{"body":"<a/>","endpoint":"http://mock:8081/soap"}}' $base/api/workspaces/billing/requests/save | jq -r .id)
          test -f $ws/billing/requests/$id.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"name":"x","draft":{"body":"<a/>"}}' $base/api/workspaces/shipping/requests/save)" = 403
          json -d '{"name":"ci-team","description":"made by the CI"}' $base/api/workspaces/create | jq -e '.name == "ci-team"'
          test -d $ws/ci-team/attachments && test -d $ws/ci-team/requests

      - name: The UI can edit a profile of a workspace, and the comments of the file survive
        run: |
          base=http://127.0.0.1:8080
          file=examples/workspaces/workspaces/billing/profiles.json
          revision=$(curl -fsS $base/api/workspaces/billing/profiles | jq -r .revision)
          curl -fsS $base/api/workspaces/billing/profiles/demo/definition \
            | jq --arg revision "$revision" '{name: "demo", revision: $revision, create: false, definition: (.definition | .timeout = 30)}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- $base/api/workspaces/billing/profiles/save | jq -e '.revision != null'
          grep -q '"timeout": 30' "$file"
          grep -q 'What the others share' "$file"
          grep -q 'A relative path starts in THIS folder' "$file"
          curl -fsS $base/api/workspaces/billing/profiles | jq -e 'all(.profiles[]; .error == null)'

      - name: Logs
        if: always()
        run: docker compose -f examples/workspaces/docker-compose.yml logs --no-color

      - name: Stop the example
        if: always()
        run: docker compose -f examples/workspaces/docker-compose.yml down -v
