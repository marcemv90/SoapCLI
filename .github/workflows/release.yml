name: Release SoapCLI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. 2.0.0; existing tags have no "v" prefix)'
        required: true
        type: string
      release_body:
        description: 'Optional release description to use when manually triggering'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish SoapCLI JAR
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.event.release.tag_name }}
      RELEASE_BODY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_body || github.event.release.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # The tag (2.0.0) becomes the version stamped into the JAR and shown by `--version`; a leading "v" is tolerated.
      - name: Build and test with Maven
        run: mvn -B -ntp -Drevision="${TAG_NAME#v}" clean verify

      - name: Prepare SoapCLI artifacts
        run: |
          mkdir -p dist
          cp target/SoapCLI.jar "dist/SoapCLI-${TAG_NAME}.jar"
          cd dist
          sha256sum "SoapCLI-${TAG_NAME}.jar" > "SoapCLI-${TAG_NAME}.jar.sha256"

      - name: Upload SoapCLI JAR and checksum to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SoapCLI-${{ env.TAG_NAME }}.jar
            dist/SoapCLI-${{ env.TAG_NAME }}.jar.sha256
          tag_name: ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_BODY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish the Docker image
    runs-on: ubuntu-latest
    needs: build-and-release
    permissions:
      contents: read
      packages: write
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.event.release.tag_name }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ghcr.io/<owner>/soapcli:<version> and :latest. Registry names must be lower case.
      - name: Build and push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soapcli"
          VERSION="${TAG_NAME#v}"
          docker build \
            --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
