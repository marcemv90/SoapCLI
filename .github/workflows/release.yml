name: Release SoapCLI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. 2.0.0; existing tags have no "v" prefix)'
        required: true
        type: string
      release_body:
        description: 'Optional release description to use when manually triggering'
        required: false
        type: string
      docker_only:
        description: 'Only (re)publish the Docker image for tag_name, built from the selected ref. The release and the JAR are left alone'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish SoapCLI JAR
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.docker_only) }}
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.event.release.tag_name }}
      RELEASE_BODY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_body || github.event.release.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # The tag (2.0.0) becomes the version stamped into the JAR and shown by `--version`; a leading "v" is tolerated.
      - name: Build and test with Maven
        run: mvn -B -ntp -Drevision="${TAG_NAME#v}" clean verify

      - name: Prepare SoapCLI artifacts
        run: |
          mkdir -p dist
          cp target/SoapCLI.jar "dist/SoapCLI-${TAG_NAME}.jar"
          cd dist
          sha256sum "SoapCLI-${TAG_NAME}.jar" > "SoapCLI-${TAG_NAME}.jar.sha256"

      - name: Upload SoapCLI JAR and checksum to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SoapCLI-${{ env.TAG_NAME }}.jar
            dist/SoapCLI-${{ env.TAG_NAME }}.jar.sha256
          tag_name: ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_BODY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish the Docker image
    runs-on: ubuntu-latest
    needs: build-and-release
    # build-and-release is skipped when only the image is republished; a failed release must not publish an image.
    if: ${{ !cancelled() && (needs.build-and-release.result == 'success' || needs.build-and-release.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.event.release.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image is published for linux/amd64 (Intel/AMD, most servers) and linux/arm64 (Apple Silicon, ARM servers).
      # The arm64 variant is assembled on this amd64 runner; only a few shell commands run under emulation, because the
      # Dockerfile builds the (platform independent) jar natively.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<owner>/soapcli:<version> and :latest. Registry names must be lower case.
      - name: Work out the image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soapcli" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      # No provenance attestation: it adds an "unknown/unknown" entry to the manifest list that some tools and
      # registry UIs mistake for a platform. The list then has exactly the two real platforms.
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Check what was published
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION" | tee inspect.txt
          grep -q "linux/amd64" inspect.txt
          grep -q "linux/arm64" inspect.txt
